<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- FAVICON Y/O LOGOTIPO DE LA PÁGINA -->
     <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">

    <!-- LIBRERIA DE FUENTES -->
     <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

     <!-- FRAMEWORD DE BOOTSTRAP -->
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

      <!-- LIBRERIA DE ICONOS -->
       <script src="https://kit.fontawesome.com/812c8ee19a.js" crossorigin="anonymous"></script>
       <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

       <link rel="stylesheet" href="css/login_2.css">
       
       <script src="js/WE_MC_03_jquery.js"></script>

</head>
<body>
    <article class="container login__pagina">
        <section class="row login__layout">
            <section class="col-xs-12 col-sm-6 col-md-6 login__imagen-panel">
                <img src="img/Caja Huancayo2.jpg" alt="" class="img-fluid login__imagen-fondo">
            </section>
            <section class="col-xs-12 col-sm-6 col-md-6 login__formulario-panel">
                <form action="">
                    <section class="login__cuerpo">
                        <section class="login__torso">
                            <img class="login__img" src="img/Caja Huancayo.avif" alt="">
                            <h1 class="login__titulo">Bienvenido Colaborador</h1>
                            <p class="login__parrafo">Ingrese sus credenciales</p>
                            <div class="login__campo">
                                <input type="text" id="usuario" placeholder="Usuario" class="login__input">
                                <i class="fa-slab-press fa-regular fa-user login__icono" aria-hidden="true"></i>
                            </div>
                            <br><br>
                            <div class="login__campo">
                                <input type="password" id="contrasena" placeholder="Contraseña" class="login__input">
                                <button type="button" class="login__ver-contrasena" aria-label="Mostrar contraseña" aria-pressed="false">
                                    <i class="fa-solid fa-eye" aria-hidden="true"></i>
                                </button>
                            </div>
                            <div class="login__opciones">
                                <label class="login__recordar">
                                    <input type="checkbox" class="login__switch">
                                    <span class="login__switch-visual" aria-hidden="true"></span>
                                    <span>Recordar usuario</span>
                                </label>
                                <a href="#" class="login__link">¿Olvidó sus credenciales?</a>
                            </div>
                            <div class="cf-turnstile login__captcha" data-sitekey="3x00000000000000000000FF"></div>
                            <button class="login__boton">Ingresar</button>                            
                        </section>
                    </section>
                </form>
            </section>
            

        </section>
        </article>
    


     <script src="js/WE_MC_02_headroom.min.js"></script>
    <script src="js/WE_MC_04_menu-flex.js"></script>
    <script>
        const campoContrasena = document.querySelector("#contrasena");
        const botonVerContrasena = document.querySelector(".login__ver-contrasena");
        const iconoContrasena = botonVerContrasena.querySelector("i");

        botonVerContrasena.addEventListener("click", () => {
            const mostrarContrasena = campoContrasena.type === "password";
            campoContrasena.type = mostrarContrasena ? "text" : "password";
            botonVerContrasena.setAttribute("aria-pressed", mostrarContrasena);
            botonVerContrasena.setAttribute(
                "aria-label",
                mostrarContrasena ? "Ocultar contraseña" : "Mostrar contraseña"
            );
            iconoContrasena.classList.toggle("fa-eye", !mostrarContrasena);
            iconoContrasena.classList.toggle("fa-eye-slash", mostrarContrasena);
        });
    </script>

</body>
</html>
